<section class="secao" id="contato">
  <h2>Fale com a gente</h2>
  <form class="formulario" id="form" novalidate>
    <label>Nome<input name="nome"></label>
    <label>E-mail<input name="email" type="email"></label>
    <label>Mensagem<textarea name="msg" rows="4"></textarea></label>
    <button class="botao">Enviar mensagem</button>
    <output id="retorno"></output>
  </form>
</section>
