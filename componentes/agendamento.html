<dialog class="modal" id="modal">
  <div class="modal-topo"><h2>Agendar demonstração</h2><button class="fechar" aria-label="Fechar">×</button></div>
  <p>Escolha um horário e mostramos tudo ao vivo para a sua equipe.</p>
  <label>Data<input type="date" name="data"></label>
  <div class="horarios">
    <label><input type="radio" name="hora" value="09:00"> 09:00</label>
    <label><input type="radio" name="hora" value="14:00"> 14:00</label>
    <label><input type="radio" name="hora" value="17:00"> 17:00</label>
  </div>
  <button class="botao" id="confirmar">Confirmar horário</button>
  <output id="retorno-demo"></output>
</dialog>
